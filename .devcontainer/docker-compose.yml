name: jobsensai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ASPECT_CLI_VERSION: v2025.46.6
        ASPECT_CLI_DOWNLOAD_SHA: 4b0ea6d2193703ebc569834cdfaf77a489e87cd6951bbf320a408928eb16c3bc
        BAZEL_VERSION: 8.4.2
        BAZEL_DOWNLOAD_SHA: 58e6042fc54f3bf5704452b579f575ae935817d4b842a76123f05fae6b1f9a83
    depends_on:
      - postgres
      - redis
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
