name: jobsensai

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobsensai
      POSTGRES_USER: jobsensai
      POSTGRES_PASSWORD: devpass
    ports:
      - "20001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobsensai" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    container_name: jobsensai-redis
    ports:
      - "20002:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
