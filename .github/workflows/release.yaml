name: Build, smoke test & push images

# Runs on ubuntu-latest, not the matrix build.yaml uses, because the images
# built here embed third-party wheels resolved against whatever machine
# invokes `bazel build`: only a linux/x86_64 build host produces linux/x86_64
# wheels. Host and target architecture must agree here or the images are
# wrong regardless of what the build reports.
#
# The pull_request trigger is permanent, not a stepping stone to the push
# trigger: it builds and smoke-tests every image and publishes none of them,
# so a broken image fails the pull request rather than a push to main.
on:
  pull_request:
    branches:
      - main
    # A push to main no longer deploys, so the most a filtered-out commit skips
    # is republishing four images nothing will reference until a tag does. A
    # tag push has no diff to filter against, so it stays unfiltered below.
    paths:
      - "scraper/**"
      - "adapters/**"
      - "api/**"
      - "web/**"
      - "oci/**"
      - "deploy/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "requirements_lock.txt"
      - ".bazelversion"
      - ".bazelrc"
      - ".github/workflows/release.yaml"
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.ref_type }}
  # Three queues result: one per pull request, one shared by pushes to main, one
  # shared by tag pushes. The third is the point: GitHub keeps at most one pending
  # run per group and discards the earlier one, so a single queue would let a push
  # to main discard a queued release and leave a tag that never shipped and never
  # said why. Two tags still serialise against each other, keeping two deploys apart.
  #
  # The push step runs four sequential, non-transactional `bazel run`
  # invocations, one per image. GitHub Actions cancels by signalling the
  # running process immediately, not at a step or job boundary, so a
  # cancellation landing between two of those pushes would leave `latest`
  # split across two commits with no failed job to show it. Queueing the
  # next run behind this one instead keeps that from ever happening.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-smoke-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.push.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache bazel
        uses: actions/cache@v6
        with:
          path: "~/.cache/bazel"
          key: release-bazel-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'requirements_lock.txt') }}
          restore-keys: |
            release-bazel-

      - name: Bazel test
        run: bazel test -- //...

      - name: Bazel build images
        run: bazel build -- //oci/...

      - name: Load images into the local daemon
        run: |
          bazel run //oci:crawler_load
          bazel run //oci:bronze_worker_load
          bazel run //oci:silver_worker_load
          bazel run //oci:web_load

      # No entrypoint override: this is the one image whose entrypoint mechanism
      # is worth exercising, since /app/main depends on the base having
      # /usr/bin/env so the py_binary stub's shebang resolves and re-execs into
      # the hermetic interpreter (see the comment on crawler_image). Scrapy logs
      # its own startup banner before the spider opens, and the pipeline needs
      # Redis at spider-open time, so with none reachable here the process
      # exits on its own without ever requesting a page.
      - name: Smoke test crawler image
        run: |
          set +e
          out=$(timeout 15 docker run --rm --network none jobsensai-crawler:latest 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q "started (bot:" || { echo "crawler image did not reach application code"; exit 1; }

      # worker.py and silver_worker.py both import scraper.database at module
      # load, which resolves the psycopg2 driver before either ever touches
      # Redis or Postgres. Reaching this log line is proof that import
      # succeeded, so the connection refusal that follows, since neither service
      # exists here, is expected and not a smoke test failure.
      - name: Smoke test bronze worker image
        run: |
          set +e
          out=$(timeout 15 docker run --rm --network none jobsensai-bronze-worker:latest 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q "Initializing database" || { echo "bronze worker image did not reach application code"; exit 1; }

      - name: Smoke test silver worker image
        run: |
          set +e
          out=$(timeout 15 docker run --rm --network none jobsensai-silver-worker:latest 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q "Initializing database" || { echo "silver worker image did not reach application code"; exit 1; }

      # Unlike the other three, this image keeps serving rather than exiting, and
      # api/app.py opens no database connection at import, so the smoke test starts
      # it detached and asks both routes directly instead of reading a log line.
      - name: Smoke test web image
        run: |
          docker run -d --rm --name jobsensai-web-smoke -p 8000:8000 jobsensai-web:latest
          trap 'docker logs jobsensai-web-smoke; docker stop jobsensai-web-smoke' EXIT
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break
            sleep 0.5
          done
          curl -sf http://localhost:8000/api/health | grep -q '"status":"ok"' || { echo "web image did not answer /api/health"; exit 1; }
          curl -sf http://localhost:8000/ | grep -qi "<!doctype html" || { echo "web image did not serve the SPA"; exit 1; }

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # This step runs on every push event, which includes a tag push: github.sha
      # is always the commit being released rather than a synthetic merge commit.
      # latest moves only on a push to main. A tag push publishes the tag itself
      # instead, alongside sha-<short> either way.
      - name: Push images
        id: push
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          SHA_TAG="sha-$SHORT_SHA"
          TAGS=(--tag "$SHA_TAG")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS+=(--tag "$GITHUB_REF_NAME")
          else
            TAGS+=(--tag latest)
          fi
          bazel run //oci:crawler_push -- "${TAGS[@]}"
          bazel run //oci:bronze_worker_push -- "${TAGS[@]}"
          bazel run //oci:silver_worker_push -- "${TAGS[@]}"
          bazel run //oci:web_push -- "${TAGS[@]}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  # needs: alone is not a tag-only gate: build-smoke-push succeeds on a pull_request
  # and on a push to main just as it does on a tag push, so needs: would be
  # satisfied every time. This job's own if: is what keeps anything but a tag push
  # from ever reaching the deploy secrets.
  deploy:
    needs: build-smoke-push
    if: github.ref_type == 'tag'
    uses: oberpierre/tools/.github/workflows/deploy-to-k8s.yml@v1
    with:
      playbook: k8s_deploy_workloads.yml
      ansible_var_file: deploy/jobsensai.yml
    secrets:
      # Passed explicitly, not via secrets: inherit, so each secret's mapping
      # is visible at the call site rather than depending on this
      # repository's secret names matching the reusable workflow's input
      # names.
      ansible_inventory_content: ${{ secrets.ANSIBLE_INVENTORY }}
      ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      # Each password is wrapped in toJSON rather than interpolated between
      # quotes: a value containing a quote, backslash or newline would
      # otherwise break the object below into invalid JSON.
      ansible_extra_vars: |
        {
          "registry_password": ${{ toJSON(secrets.JOBSENSAI_GHCR_PAT) }},
          "app_db_password": ${{ toJSON(secrets.JOBSENSAI_DB_PASSWORD) }},
          "app_redis_password": ${{ toJSON(secrets.JOBSENSAI_REDIS_PASSWORD) }},
          "app_llm_redis_password": ${{ toJSON(secrets.JOBSENSAI_LLM_REDIS_PASSWORD) }},
          "bronze_worker_image": "ghcr.io/oberpierre/jobsensai-bronze-worker:sha-${{ needs.build-smoke-push.outputs.short_sha }}",
          "silver_worker_image": "ghcr.io/oberpierre/jobsensai-silver-worker:sha-${{ needs.build-smoke-push.outputs.short_sha }}",
          "crawler_image": "ghcr.io/oberpierre/jobsensai-crawler:sha-${{ needs.build-smoke-push.outputs.short_sha }}",
          "web_image": "ghcr.io/oberpierre/jobsensai-web:sha-${{ needs.build-smoke-push.outputs.short_sha }}",
          "app_host": ${{ toJSON(secrets.JOBSENSAI_HOST) }},
          "app_basic_auth": ${{ toJSON(secrets.JOBSENSAI_BASIC_AUTH) }}
        }

  # needs: deploy is deliberate, not incidental: the release is created only after
  # the deploy job succeeds, which makes a release a record of something that
  # shipped rather than of something that was tagged.
  release:
    needs: [build-smoke-push, deploy]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # -R names the repository explicitly, which is what removes the need for a
      # checkout: gh release create needs no working tree, only the tag name.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-running a green run is the only way to redeploy a tag, since a single
          # job cannot be re-run on its own, and that re-runs this job too. Without
          # this check the deploy would succeed and the run would still end red on a
          # release that already exists.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, so leaving it untouched."
            exit 0
          fi
          PRERELEASE=()
          case "$TAG" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes "${PRERELEASE[@]}"
